# render.yaml
# Render Blueprint for the Trader API.
#
# Postgres lives on Neon rather than Render: Render's own free Postgres
# expires after a fixed period, whereas Neon's free tier does not. The
# database is therefore NOT declared here — DATABASE_URL is set by hand
# (see docs/DEPLOYMENT.md).
#
# Free web services sleep after roughly 15 minutes idle. See
# docs/DEPLOYMENT.md for the keep-warm ping that prevents that in practice.
#
# healthCheckPath is /health/ping, not /health: the global auth guard (Task
# 2) protects /health, so Render's own check would get a 401 and roll back
# every deploy. /health/ping is exempt from that guard (it's @Public()) and
# is also DB-free, for the same reason the UptimeRobot keep-warm ping
# (docs/DEPLOYMENT.md) targets it instead of /health — a check that touched
# Postgres would keep re-waking Neon on every poll.

services:
  - type: web
    name: trader-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # devDependencies are needed to compile (nest build, typescript), then
    # pruned: nothing in the runtime path needs them, and the free instance
    # has 512 MB to work with.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    # Migrations run from compiled output, not tsx — see
    # src/database/migrate.ts for why the equivalent local script avoids
    # TypeORM's own CLI.
    startCommand: node dist/database/migrate.js && node dist/main
    healthCheckPath: /health/ping
    envVars:
      # 22.13.0 has a Node bug (ERR_REQUIRE_CYCLE_MODULE, a false-positive
      # require/ESM cycle check) that crashes `nest build` via ora inside
      # @angular-devkit/schematics. Fixed by 22.23.2; stay on a recent 22.x
      # patch rather than the exact version that broke.
      - key: NODE_VERSION
        value: 22.23.2
      # Neon requires TLS; local Postgres serves none — off by default in
      # code, so it must be turned on explicitly here.
      - key: DATABASE_SSL
        value: 'true'
      # sync: false means "prompt me for this, do not store it in the repo".
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: APP_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
